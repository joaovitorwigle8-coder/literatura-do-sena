<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f"><title>Biblioteca do Sena</title>
<style>
:root{--bg:#f3eee5;--surface:#fffaf1;--ink:#2a241f;--muted:#80766d;--accent:#9b6a37;--border:rgba(42,36,31,.14);--font:Georgia,'Times New Roman',serif;--fs:18px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button{font:inherit;color:inherit}.hidden{display:none!important}
body.night{--bg:#101215;--surface:#181b20;--ink:#eee9e1;--muted:#aaa39a;--accent:#d0a065;--border:rgba(255,255,255,.12)} body.sepia{--bg:#e8dcc7;--surface:#f4e8d3;--ink:#392f26;--muted:#796b5e;--accent:#8e6032}
.screen{min-height:100%;display:none}.screen.on{display:flex;flex-direction:column}header.lib{padding:calc(28px + env(safe-area-inset-top)) 22px 20px}.ey{font-size:11px;letter-spacing:.28em;font-weight:700;color:var(--accent)}h1{font:500 clamp(34px,9vw,58px)/1.05 Georgia,serif;margin:8px 0}.sub{color:var(--muted);margin:0}
.shelf{padding:10px 22px 36px;flex:1}.card{max-width:840px;margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:20px;display:grid;grid-template-columns:minmax(120px,230px) 1fr;gap:24px;box-shadow:0 18px 50px rgba(0,0,0,.12)}.cover{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(#28221c,#0e0c0a);position:relative;overflow:hidden;box-shadow:0 14px 28px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:#eee6d5;font-family:Georgia,serif}.cover:after{content:'SENA';position:absolute;bottom:30px;color:#c6a86a;font-size:20px;letter-spacing:.16em}.cover span{font-size:clamp(18px,4vw,34px);line-height:1.22}.info{display:flex;flex-direction:column;justify-content:center}.info h2{font:500 clamp(28px,6vw,46px)/1.05 Georgia,serif;margin:0 0 8px}.info p{color:var(--muted);margin:0 0 24px}.primary{border:0;border-radius:999px;padding:14px 20px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer;align-self:flex-start}.progress{margin-top:14px;color:var(--muted);font-size:13px}
.reader{height:100dvh;overflow:hidden}.top,.bottom{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);z-index:3}.top{padding-top:env(safe-area-inset-top);height:calc(58px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}.bottom{padding-bottom:env(safe-area-inset-bottom);height:calc(50px + env(safe-area-inset-bottom));border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.icon{border:0;background:transparent;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}.title{flex:1;min-width:0;text-align:center}.title b,.title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title b{font-size:13px}.title small{font-size:11px;color:var(--muted);margin-top:3px}
.viewport{position:relative;flex:1;overflow:hidden;padding:0 clamp(20px,6vw,72px)}.pages{height:100%;width:100%;font-family:var(--font);font-size:var(--fs);line-height:1.65;column-width:calc(100vw - clamp(40px,12vw,144px));column-gap:clamp(40px,7vw,82px);column-fill:auto;padding:clamp(28px,5vh,54px) 0;transition:transform .2s ease;will-change:transform}.pages p{margin:0 0 .9em;text-indent:1.35em;break-inside:avoid-column}.pages p.short,.pages p.dialogue{text-indent:0}.part{break-before:column;margin:18vh 0 1.5em;text-align:center;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font:700 .72em Arial,sans-serif}.chapter{break-before:column;margin:12vh 0 1.2em;font:500 1.7em/1.15 Georgia,serif}.chapter small{display:block;font:700 .35em Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:.8em}.bottom input{flex:1;accent-color:var(--accent)}
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:16px;z-index:10;display:none}.panel.open{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.seg button,.smallbtn{border:1px solid var(--border);background:transparent;border-radius:999px;padding:8px 11px;cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg)}.toc{max-height:45vh;overflow:auto;margin-top:10px;border-top:1px solid var(--border)}.toc button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;padding:12px 4px;cursor:pointer}
@media(max-width:620px){.card{grid-template-columns:125px 1fr;gap:16px;padding:16px}.info h2{font-size:24px}.cover span{font-size:18px}}
</style></head>
