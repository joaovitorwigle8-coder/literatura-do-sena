<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>Biblioteca do Sena</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="library" class="screen on">
    <header class="lib">
      <div class="ey">LITERATURA DO SENA</div>
      <h1>Minha Biblioteca</h1>
      <p class="sub">Seus livros, no seu tempo.</p>
    </header>
    <main class="shelf">
      <article class="card">
        <div class="cover"><span>TUDO O QUE O<br>SILÊNCIO<br>NÃO LEVOU</span></div>
        <div class="info">
          <h2>Tudo o que o Silêncio Não Levou</h2>
          <p>Sena</p>
          <button class="primary" id="open" disabled>Carregando livro…</button>
          <div class="progress" id="libProgress">0% lido</div>
          <div class="loading" id="loading">Preparando sua biblioteca…</div>
        </div>
      </article>
    </main>
  </section>
  <section id="reader" class="screen reader">
    <div class="top">
      <button class="icon" id="back" aria-label="Voltar">‹</button>
      <div class="title"><b>Tudo o que o Silêncio Não Levou</b><small id="chap">Capítulo 1</small></div>
      <button class="icon" id="aa" aria-label="Ajustes">Aa</button>
    </div>
    <div class="viewport" id="vp"><article class="pages" id="pages"></article></div>
    <div class="bottom">
      <span id="pg">1 de 1</span>
      <input id="slider" type="range" min="0" max="100" value="0" aria-label="Progresso">
      <span id="pct">0%</span>
    </div>
  </section>
  <div class="panel" id="panel">
    <div class="row"><span>Tema</span><div class="seg">
      <button data-theme="paper" class="on">Papel</button>
      <button data-theme="sepia">Sépia</button>
      <button data-theme="night">Noite</button>
    </div></div>
    <div class="row"><span>Tamanho</span><div class="seg">
      <button id="minus">A−</button><button id="plus">A+</button>
    </div></div>
    <div class="row"><span>Fonte</span><div class="seg">
      <button data-font="serif" class="on">Serifada</button>
      <button data-font="sans">Limpa</button>
    </div></div>
    <div class="toc" id="toc"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
